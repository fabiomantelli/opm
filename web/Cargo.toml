[package]
name = "opm-web"
version = "0.1.0"
edition = "2021"

[dependencies]
opm-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.7", features = ["http", "websocket", "json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
futures = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DomRect", "Element", "HtmlElement", "HtmlInputElement", "SvgsvgElement", "Storage", "Location", "KeyboardEvent", "PointerEvent", "WheelEvent", "console", "Navigator", "Clipboard", "MediaQueryList", "ClipboardEvent", "DataTransfer", "Document", "Performance"] }
